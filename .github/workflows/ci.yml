name: CI
on:
  pull_request:
  push:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: 8
            distribution: zulu
          - os: macos-latest
            java: 8
            distribution: zulu
          - os: windows-latest
            java: 8
            distribution: zulu
          - os: ubuntu-latest
            java: 11
            distribution: zulu
          - os: macos-latest
            java: 11
            distribution: zulu
          - os: windows-latest
            java: 11
            distribution: zulu
          - os: ubuntu-latest
            java: 17
            distribution: zulu
          - os: macos-latest
            java: 17
            distribution: zulu
          - os: windows-latest
            java: 17
            distribution: zulu
          - os: ubuntu-latest
            java: 25
            distribution: zulu
          - os: macos-latest
            java: 25
            distribution: zulu
          - os: windows-latest
            java: 25
            distribution: zulu

          - os: ubuntu-latest
            java: 11
            distribution: temurin
          - os: macos-latest
            java: 11
            distribution: temurin
          - os: windows-latest
            java: 11
            distribution: temurin
          - os: ubuntu-latest
            java: 17
            distribution: temurin
          - os: macos-latest
            java: 17
            distribution: temurin
          - os: windows-latest
            java: 17
            distribution: temurin
          - os: ubuntu-latest
            java: 25
            distribution: temurin
          - os: macos-latest
            java: 25
            distribution: temurin
          - os: windows-latest
            java: 25
            distribution: temurin

          - os: ubuntu-latest
            java: 17
            distribution: oracle
          - os: macos-latest
            java: 17
            distribution: oracle
          - os: windows-latest
            java: 17
            distribution: oracle
          - os: ubuntu-latest
            java: 25
            distribution: oracle
          - os: macos-latest
            java: 25
            distribution: oracle
          - os: windows-latest
            java: 25
            distribution: oracle
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: "${{ matrix.distribution }}"
        java-version: "${{ matrix.java }}"
        check-latest: "true"
        cache: sbt
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
    - name: Distrust compromised certs manually
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          bash bin/distrust-emudhra.sh "$JAVA_HOME"
        else
          sudo -E bash bin/distrust-emudhra.sh "$JAVA_HOME"
        fi
    - name: Test
      shell: bash
      run: sbt -v run
